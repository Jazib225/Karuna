[package]
name = "karuna-desktop"
version = "0.1.1"
edition = "2021"
description = "Karuna desktop app: the console window and the island"
license = "UNLICENSED"

[lib]
name = "karuna_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["net", "io-util", "sync", "time", "macros", "rt"] }
# Opening Karuna again focuses the running copy instead of starting a second one.
tauri-plugin-single-instance = "2"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Input_KeyboardAndMouse",
] }
# The island's microphone permission (Karuna Voice); the same version Tauri's WebView2 uses.
webview2-com = "0.39"

[profile.release]
codegen-units = 1
lto = true
strip = true
