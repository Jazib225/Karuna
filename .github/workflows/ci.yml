# CI: every pull request and every push to main must pass all of this before it can merge.
# Runs on GitHub's machines with no secrets: nothing here touches Arc testnet, Circle or QuickNode.
# Locally, `pnpm ci:check` (plus `forge test` in contracts/) runs the same checks.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    name: Typecheck (all packages)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4 # version comes from "packageManager" in package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck

  unit:
    name: Unit tests (engine, relay, agents)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Policy engine + signed log
        run: pnpm --dir engine test
      - name: Relay (QuickNode signatures, decoding)
        run: pnpm --dir relay test
      - name: Agents hold no keys
        # A clean environment, so the runner's own variables can't trip (or hide) the scan.
        run: env -i PATH="$PATH" HOME="$HOME" pnpm --dir agents check:no-keys

  gatekeeper:
    name: Gatekeeper tests (real Dharma on a local chain)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: foundry-rs/foundry-toolchain@v1 # puts anvil on PATH
        with:
          version: v1.9.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir gatekeeper test

  contracts:
    name: Dharma contract (forge) + generated ABI is up to date
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive # forge-std
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.9.0
      - run: pnpm install --frozen-lockfile
      - name: Contract tests
        working-directory: contracts
        run: forge test -vv
      - name: ABI + bytecode used by the Gatekeeper and console match the contract
        working-directory: contracts
        run: |
          node scripts/export-abi.mjs
          git diff --exit-code -- js/ || {
            echo "::error::contracts/js is out of date. Run 'pnpm --dir contracts build' and commit the result."
            exit 1
          }

  web:
    name: Console builds
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir web build
