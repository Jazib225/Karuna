<!doctype html>
<html lang="en">
  <head>
    <!-- Theme before first paint (see src/theme.ts), so a dark-mode console never flashes white. -->
    <script>try{var p=localStorage.getItem("karuna.theme");var d=p==="dark"||(p!=="light"&&matchMedia("(prefers-color-scheme: dark)").matches);document.documentElement.dataset.theme=d?"dark":"light";document.documentElement.style.colorScheme=d?"dark":"light";}catch(e){}</script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Karuna Console</title>
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="theme-color" content="#fafafa" />
    <meta name="description" content="An agent's competence should never be its permission. Karuna is a permission layer for autonomous AI agents." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
