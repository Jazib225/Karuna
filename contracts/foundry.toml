[profile.default]
src = "src"
out = "out"
libs = ["lib"]
optimizer = true
optimizer_runs = 1   # optimize for size: each half of Dharma (Dharma, DharmaExt) must stay under the 24 KB contract limit
solc_version = "0.8.30"   # pinned: the committed bytecode in js/ must be what every machine builds
via_ir = true
bytecode_hash = "none"   # no source fingerprint in the bytecode: identical builds on Windows, macOS and Linux
cbor_metadata = false

[lint]
lint_on_build = false
